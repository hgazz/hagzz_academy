name: API-Laravel-CI/CD
 
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-cicd:
    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.1'

      # - uses: actions/checkout@v3

      # - name: Copy .env
      #   run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # - name: Install Dependencies
      #   run: composer update

      # - name: Generate key
      #   run: php artisan key:generate

      # - name: Directory Permissions
      #   run: chmod -R 777 storage bootstrap/cache
      
      # - name: Execute tests (Unit and Feature tests) via PHPUnit
      #   env:
      #    DB_CONNECTION: mysql
      #    DB_HOST: ${{ secrets.DB_HOST_D }}
      #    DB_DATABASE: ${{ secrets.DB_DATABASE_D }}
      #    DB_USERNAME: ${{ secrets.DB_USERNAME_D }}
      #    DB_PASSWORD: ${{ secrets.DB_PASSWORD_D }}
      #   run: vendor/bin/phpunit

  deploy-server:
    runs-on: ubuntu-latest
    needs: build-cicd
    steps:
      - name: SSH Deploy to Production Server
        if: ( github.event_name == 'push' ||  github.event_name == 'pull_request' ) && github.ref == 'refs/heads/master' && env.HAS_REMOTE_HOST == 'true'
        env:
          HAS_REMOTE_HOST: ${{ secrets.REMOTE_HOST != '' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME || 'hagzz' }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            echo "=== Step 1: Navigating to Academy app and pulling latest changes ==="
            APP_DIR="${{ secrets.REMOTE_PATH }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/home/hagzz/hagzz/apps/hagzz_academy"; fi
            cd "$APP_DIR"
            git fetch origin master
            git reset --hard origin/master

            echo "=== Step 2: Rebuilding Docker container ==="
            INFRA_DIR="/home/hagzz/hagzz/infra"
            if [ -d "$INFRA_DIR" ]; then
              cd "$INFRA_DIR"
              docker compose build academy
              docker compose up -d academy
            fi

            echo "=== Step 3: Running Migrations and Cache Clear ==="
            docker exec hagzz-academy-1 php artisan migrate --force || true
            docker exec -u root hagzz-academy-1 php artisan storage:link --force || true
            docker exec hagzz-academy-1 php artisan route:clear || true
            docker exec hagzz-academy-1 php artisan route:cache || true
            docker exec hagzz-academy-1 php artisan config:clear || true
            docker exec hagzz-academy-1 php artisan config:cache || true
            docker exec hagzz-academy-1 php artisan view:clear || true
            echo "=== Deployment Finished Successfully ==="
            
